name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

defaults:
  run:
    shell: bash

jobs:
  build_release:
    name: Build Windows Release
    runs-on: windows-2022

    # Required to upload release artifacts to GitHub
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build and publish Windows release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NODE_ENV: "production"
      run: |
        # Skip lint and test, build directly (matching local build process)
        npm run clean
        npm run preload:build
        npm run client:build
        npm run build:distro -- --win --publish
        # Skip build:test-distro as it's optional for releases
