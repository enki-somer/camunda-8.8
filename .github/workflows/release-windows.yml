name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

defaults:
  run:
    shell: bash

jobs:
  build_release:
    name: Build Windows Release
    runs-on: windows-2022

    # Required to upload release artifacts to GitHub
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Get tag
      id: tag
      run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create or update GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Check if release exists, create if not
        if ! gh release view ${{ steps.tag.outputs.TAG }} > /dev/null 2>&1; then
          echo "Creating release ${{ steps.tag.outputs.TAG }}"
          gh release create ${{ steps.tag.outputs.TAG }} --title "${{ steps.tag.outputs.TAG }}" --notes "Release ${{ steps.tag.outputs.TAG }}"
        else
          echo "Release ${{ steps.tag.outputs.TAG }} already exists"
        fi

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build and publish Windows release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NODE_ENV: "production"
      run: |
        npm run clean
        npm run preload:build
        npm run client:build
        npm run build:distro -- --win --publish=always
